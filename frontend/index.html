<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectHub - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menu Lateral -->
    <aside class="sidebar">
        <h2>ProjectHub</h2>
        <button class="btn-novo" onclick="abrirModal()">+ Nova Tarefa</button>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <header class="main-header">
            <h1>Visão Geral dos Projetos</h1>
        </header>

        <div id="projetos-grid" class="projetos-grid">
            <!-- Cards dos projetos injetados via JS -->
        </div>
    </main>

    <!-- Modal de Criação de Tarefa -->
    <div id="modal-container" class="modal-container hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Criar Nova Tarefa</h2>
                <button class="btn-fechar" onclick="fecharModal()">✕</button>
            </div>
            <form id="form-tarefa" onsubmit="salvarTarefa(event)">
                <div class="form-group">
                    <label for="input-titulo">Título da Tarefa</label>
                    <input type="text" id="input-titulo" placeholder="Ex: Criar documentação" required>
                </div>
                <div class="form-group">
                    <label for="select-projeto">Projeto Relacionado</label>
                    <select id="select-projeto" required></select>
                </div>
                <button type="submit" class="btn-novo">Salvar Tarefa</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
